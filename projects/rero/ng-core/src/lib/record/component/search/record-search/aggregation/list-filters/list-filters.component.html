@if (filters().length) {
  <div class="core:flex core:flex-wrap core:mb-2">
    @for (filter of filters(); track filter.key) {
      <p-button
        class="core:mr-2 core:mb-2"
        [label]="(filter.label$ | async)!"
        icon="fa-solid fa-xmark"
        [outlined]="true"
        severity="secondary"
        [title]="filter.aggregationKey | translate"
        (onClick)="removeFilter(filter)"
      />
    }
    <div class="core:flex core:w-full core:justify-start core:lg:w-auto core:lg:justify-end core:lg:ml-auto">
      <p-button
        class="core:mb-2"
        icon="fa-solid fa-xmark"
        [outlined]="true"
        severity="secondary"
        [title]="'Remove all filters' | translate"
        [aria-label]="'Remove all filters' | translate"
        (onClick)="store.clearFilters()"
      />
    </div>
  </div>
}
